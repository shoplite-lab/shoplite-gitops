# OpenTelemetry Operator. Two jobs here:
#   - runs the Collector declared as an `OpenTelemetryCollector` (platform-resources/observability)
#   - injects the OTel Java agent into pods annotated instrumentation.opentelemetry.io/inject-java,
#     so services get traces + metrics without any code or Dockerfile change.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-operator
    targetRevision: 0.124.1
    helm:
      releaseName: opentelemetry-operator
      valuesObject:
        manager:
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
        admissionWebhooks:
          certManager:
            enabled: true
          # Self-generated certs change on every render -> permanent OutOfSync in Argo CD.
          autoGenerateCert:
            enabled: false
          # The pod webhook only sees pods that asked for the agent (label set by
          # charts/microservice), and fails closed: while the operator is down (e.g. right
          # after a cluster restart) their creation is refused and the ReplicaSet retries,
          # instead of the default Ignore silently starting them without the agent.
          # Scoping by label keeps every other pod, the operator's own included, unaffected.
          pods:
            failurePolicy: Fail
            objectSelector:
              matchLabels:
                shoplite/otel-agent: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
