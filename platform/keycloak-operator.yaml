# Keycloak Operator (official): runs Keycloak declared as a `Keycloak` resource.
# Installed from the upstream kustomization, which pins every RBAC subject to the
# `keycloak` namespace; the operator watches only that namespace, so the Keycloak
# instance (platform-resources/keycloak) lives there too.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://github.com/keycloak/keycloak-k8s-resources.git
    targetRevision: 26.7.5 # = Keycloak server version the operator deploys
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRDs exceed the client-side apply annotation size limit
