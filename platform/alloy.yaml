# Grafana Alloy: ships the stdout of every pod to Loki.
# It reads logs through the Kubernetes API (like `kubectl logs`), so one replica covers
# all nodes and needs no hostPath mounts. A DaemonSet reading /var/log/pods is the usual
# choice for big clusters; the API route is lighter for a laptop.
#
# Spring Boot services log JSON (logstash format, charts/microservice `observability`):
# `level` becomes a label (cheap to filter on) and `trace_id` becomes structured metadata,
# so Grafana can jump from a log line to its trace in Tempo and back.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.13.1
    helm:
      releaseName: alloy
      valuesObject:
        controller:
          type: deployment
          replicas: 1
        alloy:
          enableReporting: false
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          configMap:
            content: |
              discovery.kubernetes "pods" {
                role = "pod"
              }

              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "app"
                }
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.process.pods.receiver]
              }

              loki.process "pods" {
                // Lines that are not JSON (Kong, Keycloak, Kafka...) pass through unchanged.
                stage.json {
                  expressions = { level = "level", trace_id = "trace_id" }
                }
                stage.labels {
                  values = { level = "" }
                }
                stage.structured_metadata {
                  values = { trace_id = "" }
                }
                forward_to = [loki.write.loki.receiver]
              }

              loki.write "loki" {
                endpoint {
                  url = "http://loki.observability:3100/loki/api/v1/push"
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
