# ShopLite - full local stack (Phase 1).
# Browser entry points (all through Kong on :8000, *.localhost resolves to 127.0.0.1):
#   http://shop.localhost:8000      React app + /api/*
#   http://auth.localhost:8000      Keycloak (admin console: admin / admin)
#   http://grafana.localhost:8000   Grafana (SSO via Keycloak)
name: shoplite

x-java-service: &java-service
  restart: unless-stopped
  volumes:
    - otel-agent:/otel:ro

x-java-deps: &java-deps
  otel-agent: { condition: service_completed_successfully }
  postgres: { condition: service_healthy }
  kong: { condition: service_started }

x-java-env: &java-env
  # Zero-code instrumentation: the same Java agent the OpenTelemetry Operator injects on Kubernetes.
  JAVA_TOOL_OPTIONS: -javaagent:/otel/javaagent.jar
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  OIDC_ISSUER_URI: http://auth.localhost:8000/realms/shoplite

services:
  # ---------------- infrastructure ----------------
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"] # 5432 often taken by a host PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  redis:
    image: valkey/valkey:8.1-alpine
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:4.1.2
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: keycloak_pw
      # Public URL = through Kong. The token "iss" claim is built from it, so it must be
      # identical for the browser, Kong and every backend service.
      KC_HOSTNAME: http://auth.localhost:8000
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres: { condition: service_healthy }

  kong:
    image: kong:3.9.3
    ports: ["8000:8000", "8001:8001"]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_TRACING_INSTRUMENTATIONS: all
      KONG_TRACING_SAMPLING_RATE: "1.0"
    volumes:
      - ./kong:/kong:ro
    networks:
      default:
        # Containers resolve the public hostnames to Kong too, so a backend fetching
        # http://auth.localhost:8000/... reaches Keycloak exactly the way a browser does.
        aliases: [shop.localhost, auth.localhost, grafana.localhost]

  # Grafana + Loki + Tempo + Prometheus + OTel Collector in one image (local only).
  lgtm:
    image: grafana/otel-lgtm:0.36.0
    ports: ["3000:3000", "4317:4317", "4318:4318"]
    environment:
      GF_SERVER_ROOT_URL: http://grafana.localhost:8000
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: grafana-dev-secret
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://auth.localhost:8000/realms/shoplite/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://auth.localhost:8000/realms/shoplite/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://auth.localhost:8000/realms/shoplite/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'devops') && 'Admin' || 'Viewer'"
      GF_AUTH_SIGNOUT_REDIRECT_URL: http://auth.localhost:8000/realms/shoplite/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=http%3A%2F%2Fgrafana.localhost%3A8000%2Flogin

  # Copies the OpenTelemetry Java agent into a shared volume - exactly what the init
  # container injected by the OpenTelemetry Operator does on Kubernetes.
  otel-agent:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.32.0
    command: ["cp", "/javaagent.jar", "/otel/javaagent.jar"]
    volumes:
      - otel-agent:/otel

  # ---------------- application ----------------
  user-service:
    <<: *java-service
    build: ../../shoplite-user-service
    depends_on: *java-deps
    environment:
      <<: *java-env
      OTEL_SERVICE_NAME: user-service
      DB_URL: jdbc:postgresql://postgres:5432/users
      DB_USER: users_app
      DB_PASSWORD: users_pw

  product-service:
    <<: *java-service
    build: ../../shoplite-product-service
    depends_on:
      <<: *java-deps
      redis: { condition: service_started }
    environment:
      <<: *java-env
      OTEL_SERVICE_NAME: product-service
      DB_URL: jdbc:postgresql://postgres:5432/products
      DB_USER: products_app
      DB_PASSWORD: products_pw
      REDIS_HOST: redis

  order-service:
    <<: *java-service
    build: ../../shoplite-order-service
    depends_on:
      <<: *java-deps
      kafka: { condition: service_started }
    environment:
      <<: *java-env
      OTEL_SERVICE_NAME: order-service
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USER: orders_app
      DB_PASSWORD: orders_pw
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRODUCT_SERVICE_URL: http://product-service:8080
      OIDC_TOKEN_URI: http://auth.localhost:8000/realms/shoplite/protocol/openid-connect/token
      OIDC_CLIENT_SECRET: order-service-dev-secret

  notification-service:
    <<: *java-service
    build: ../../shoplite-notification-service
    depends_on:
      <<: *java-deps
      kafka: { condition: service_started }
    environment:
      <<: *java-env
      OTEL_SERVICE_NAME: notification-service
      DB_URL: jdbc:postgresql://postgres:5432/notifications
      DB_USER: notifications_app
      DB_PASSWORD: notifications_pw
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  frontend:
    build: ../../shoplite-frontend
    restart: unless-stopped
    environment:
      OIDC_AUTHORITY: http://auth.localhost:8000/realms/shoplite
      OIDC_CLIENT_ID: shop-frontend
      API_BASE_URL: ""

volumes:
  pgdata:
  otel-agent:
