# image.tag changes only through a promote PR (Actions > promote).
image:
  repository: ghcr.io/shoplite-lab/shoplite-order-service
  tag: main

ingress:
  host: shop.localhost
env:
  # One Kafka cluster for both envs: topics are prefixed per environment.
  SHOPLITE_KAFKA_ORDERCREATEDTOPIC: prod.order.created
