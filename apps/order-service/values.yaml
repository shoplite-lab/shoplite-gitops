# Shared by dev and prod. Chart defaults: charts/microservice/values.yaml
postgres:
  enabled: true
  database: orders
  owner: orders_app
env:
  KAFKA_BOOTSTRAP_SERVERS: shoplite-kafka-bootstrap.kafka:9092
  KAFKA_TOPIC_REPLICAS: "1"
  # East-west call: straight to the Service in the same namespace, not through Kong.
  PRODUCT_SERVICE_URL: http://product-service:8080
  # Client-credentials token for that call, also fetched in-cluster (not via Kong).
  OIDC_TOKEN_URI: http://keycloak-service.keycloak:8080/realms/shoplite/protocol/openid-connect/token
secretEnv:
  OIDC_CLIENT_SECRET: { secret: order-service-oidc, key: client-secret } # bootstrap/secrets.sh
oidc:
  enabled: true
observability:
  enabled: true
ingress:
  enabled: true
  routes:
    - name: api
      paths: [/api/orders]
      plugins: [cors, jwt-keycloak, rate-limit-orders]
