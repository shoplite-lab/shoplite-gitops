# Shared by dev and prod. Chart defaults: charts/microservice/values.yaml
postgres:
  enabled: true
  database: notifications
  owner: notifications_app
env:
  KAFKA_BOOTSTRAP_SERVERS: shoplite-kafka-bootstrap.kafka:9092
oidc:
  enabled: true
observability:
  enabled: true
ingress:
  enabled: true
  routes:
    - name: api
      paths: [/api/notifications]
      plugins: [cors, jwt-keycloak]
