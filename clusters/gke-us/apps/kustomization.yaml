# The ApplicationSet from apps/ with what changes on GKE:
#   - both environments run (prod is not paused)
#   - Helm gets three more values files from this cluster directory, after apps/<svc>/values*.yaml
#   - each app learns the name of its secret in Secret Manager (shoplite-db-<svc>-<env>)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../apps

patches:
  - target: { kind: ApplicationSet, name: shop }
    patch: |-
      - op: replace
        path: /spec/generators/0/matrix/generators/0/list/elements/1/paused
        value: "false"
      - op: add
        path: /spec/template/spec/source/helm/valueFiles/-
        value: "../../clusters/gke-us/values.yaml"
      - op: add
        path: /spec/template/spec/source/helm/valueFiles/-
        value: "../../clusters/gke-us/values-{{ .env }}.yaml"
      - op: add
        path: /spec/template/spec/source/helm/valueFiles/-
        value: "../../clusters/gke-us/values-{{ .component }}.yaml"
      - op: add
        path: /spec/template/spec/source/helm/parameters/-
        value:
          name: postgres.external.remoteKey
          value: "shoplite-db-{{ .component }}-{{ .env }}"
