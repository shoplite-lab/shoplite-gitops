# External Secrets Operator: copies secrets from GCP Secret Manager into Kubernetes Secrets
# (GKE replacement for bootstrap/secrets.sh). Authenticates with Workload Identity: the
# controller's ServiceAccount is bound to the Google service account shoplite-eso (Terraform,
# shoplite-infra/gcp/cluster), which may read the shoplite-* secrets and nothing else.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    # First of all: Kong (wave -30) mounts a Secret that this operator has to create.
    argocd.argoproj.io/sync-wave: "-40"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.13.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        serviceAccount:
          name: external-secrets # must match gcp/cluster variables.tf (workload_identity.eso)
          annotations:
            iam.gke.io/gcp-service-account: shoplite-eso@shoplite-demo-1e7583.iam.gserviceaccount.com
        resources:
          requests: { cpu: 20m, memory: 64Mi }
        webhook:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
        certController:
          resources:
            requests: { cpu: 10m, memory: 64Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
