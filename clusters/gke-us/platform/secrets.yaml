# The ClusterSecretStore and every ExternalSecret (clusters/gke-us/secrets). After this
# wave the cluster has all the Secrets that bootstrap/secrets.sh creates on k3d.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  project: default
  source:
    repoURL: https://github.com/shoplite-lab/shoplite-gitops.git
    targetRevision: main
    path: clusters/gke-us/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
