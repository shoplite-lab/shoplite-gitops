# Namespaces that must exist before their Secrets do (the apps that normally create them
# run later). argocd and external-secrets already exist by now.
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
