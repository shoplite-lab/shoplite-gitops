# Every Kubernetes Secret the cluster needs, built from Secret Manager (GKE replacement for
# bootstrap/secrets.sh). Values are seeded once by shoplite-infra/scripts/seed-secrets.sh; git only
# holds names.
---
# keycloak/realm-secrets: read by the realm-import Job (envFrom) to fill $(env:NAME) in realm.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: realm-secrets
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: realm-secrets
    creationPolicy: Owner
  data:
    - secretKey: REALM_RSA_PRIVATE_KEY
      remoteRef: { key: shoplite-realm-rsa-private-key }
    - secretKey: ORDER_SERVICE_CLIENT_SECRET
      remoteRef: { key: shoplite-order-service-client-secret }
    - secretKey: GRAFANA_CLIENT_SECRET
      remoteRef: { key: shoplite-grafana-client-secret }
    - secretKey: ARGOCD_CLIENT_SECRET
      remoteRef: { key: shoplite-argocd-client-secret }
    - secretKey: KAFKA_UI_CLIENT_SECRET
      remoteRef: { key: shoplite-kafka-ui-client-secret }
    - secretKey: ALICE_PASSWORD
      remoteRef: { key: shoplite-alice-password }
    - secretKey: BOB_PASSWORD
      remoteRef: { key: shoplite-bob-password }
    - secretKey: DEVOPS1_PASSWORD
      remoteRef: { key: shoplite-devops1-password }
    - secretKey: VIEWER1_PASSWORD
      remoteRef: { key: shoplite-viewer1-password }
---
# keycloak/keycloak-db-app: credentials of Keycloak's external Postgres. The remote secret is JSON
# with username, password (and host, port, dbname, kept for reference). keycloak.yaml reads
# username and password from here; the JDBC URL is in the Keycloak CR (clusters/gke-us/keycloak).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-app
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: keycloak-db-app
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: shoplite-db-keycloak
---
# kong/keycloak-jwt: the credential Kong's jwt plugin checks tokens against (consumer.yaml).
# Same shape as bootstrap/secrets.sh builds: key = issuer (the token's iss claim).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-jwt
  namespace: kong
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: keycloak-jwt
    creationPolicy: Owner
    template:
      metadata:
        labels:
          konghq.com/credential: jwt
      data:
        key: https://auth.neststack.site/realms/shoplite
        algorithm: RS256
        rsa_public_key: "{{ .pub }}"
  data:
    - secretKey: pub
      remoteRef: { key: shoplite-realm-rsa-public-key }
---
# kong/kong-origin-tls: Cloudflare Origin certificate. Kong serves it as its default certificate
# (platform kong patch: ssl_cert / ssl_cert_key). Remote secret is JSON {"tls.crt": ..., "tls.key": ...}.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kong-origin-tls
  namespace: kong
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: kong-origin-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  dataFrom:
    - extract:
        key: shoplite-tls-origin
---
# shop-dev/order-service-oidc: client secret for order-service's client-credentials token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: order-service-oidc
  namespace: shop-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: order-service-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef: { key: shoplite-order-service-client-secret }
---
# shop-prod/order-service-oidc: client secret for order-service's client-credentials token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: order-service-oidc
  namespace: shop-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: order-service-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef: { key: shoplite-order-service-client-secret }
---
# observability/grafana-secrets: break-glass admin login and the OIDC client secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secrets
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: grafana-secrets
    creationPolicy: Owner
    template:
      data:
        admin-user: admin
        admin-password: "{{ .admin_password }}"
        oidc-client-secret: "{{ .oidc_client_secret }}"
  data:
    - secretKey: admin_password
      remoteRef: { key: shoplite-grafana-admin-password }
    - secretKey: oidc_client_secret
      remoteRef: { key: shoplite-grafana-client-secret }
---
# argocd/argocd-oidc: Argo CD only resolves $<secret>:<key> references from Secrets carrying this label.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: argocd-oidc
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: client-secret
      remoteRef: { key: shoplite-argocd-client-secret }
---
# kafka/kafka-ui-oidc
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-ui-oidc
  namespace: kafka
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: kafka-ui-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef: { key: shoplite-kafka-ui-client-secret }
---
# external-dns/cloudflare-api-token: token with Zone.DNS:Edit on the domain's zone.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef: { key: shoplite-cloudflare-api-token }
