# One store for the whole cluster. No auth block: External Secrets uses the Google identity of
# its own pod (Workload Identity, see platform/external-secrets.yaml): no key file anywhere.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    gcpsm:
      projectID: shoplite-demo-1e7583
