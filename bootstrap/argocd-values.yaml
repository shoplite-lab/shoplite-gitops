# Helm values for Argo CD (chart argo/argo-cd).
# Used twice: once by bootstrap/up.sh (helm install, chicken-and-egg), then forever by
# platform/argocd.yaml, where Argo CD manages its own upgrades from git.
global:
  domain: argocd.localhost

configs:
  params:
    # TLS ends at Kong (plain HTTP locally); argocd-server must not redirect to https itself.
    server.insecure: true
  cm:
    # Plain http: the chart would otherwise build https://<domain>, and the OIDC redirect
    # URI sent to Keycloak would not match the client.
    url: http://argocd.localhost
    # Login through Keycloak (client `argocd`). The issuer must be reachable from the
    # argocd-server pod: platform-resources/local-dns rewrites auth.localhost to Kong.
    oidc.config: |
      name: Keycloak
      issuer: http://auth.localhost/realms/shoplite
      clientID: argocd
      clientSecret: $argocd-oidc:client-secret
      requestedScopes: [openid, profile, email, groups]
      logoutURL: http://auth.localhost/realms/shoplite/protocol/openid-connect/logout?id_token_hint={{token}}&post_logout_redirect_uri={{logoutRedirectURL}}
    # SSO only. Break-glass if Keycloak is down: set true and push; Argo CD keeps syncing
    # from git without anyone logged in.
    admin.enabled: false
    # Since Argo CD 1.8 a parent app does not wait for child Applications to be healthy.
    # Restoring this health check makes sync waves in platform/ meaningful:
    # operators (wave -10) are Healthy before the resources that need their CRDs (wave 0).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
    # Built-in CNPG check (argo-cd resource_customizations/postgresql.cnpg.io/Cluster) with one
    # change: a hibernated cluster (apps/appset.yaml `paused`) is Healthy, not Suspended.
    # Suspended never turns Healthy, so a sync waiting on it would hang forever, and a
    # paused environment is a normal state, not something to look at.
    resource.customizations.health.postgresql.cnpg.io_Cluster: |
      local hs = {}
      local phases = {
        ["Cluster in healthy state"] = "Healthy",
        ["Setting up primary"] = "Progressing",
        ["Creating a new replica"] = "Progressing",
        ["Upgrading cluster"] = "Progressing",
        ["Waiting for the instances to become active"] = "Progressing",
        ["Promoting to primary cluster"] = "Progressing",
        ["Switchover in progress"] = "Degraded",
        ["Failing over"] = "Degraded",
        ["Upgrading Postgres major version"] = "Degraded",
        ["Cluster upgrade delayed"] = "Degraded",
        ["Waiting for user action"] = "Degraded",
        ["Primary instance is being restarted in-place"] = "Degraded",
        ["Primary instance is being restarted without a switchover"] = "Degraded",
        ["Online upgrade in progress"] = "Degraded",
        ["Applying configuration"] = "Degraded",
        ["Unable to create required cluster objects"] = "Suspended",
        ["Cluster is unrecoverable and needs manual intervention"] = "Suspended",
      }
      if obj.status == nil or obj.status.conditions == nil then
        hs.status = "Progressing"
        return hs
      end
      for _, c in ipairs(obj.status.conditions) do
        if c.type == "cnpg.io/hibernation" and c.status == "True" then
          hs.status = "Healthy"
          hs.message = "Hibernated: " .. (c.message or "")
          return hs
        end
      end
      local annotations = obj.metadata.annotations or {}
      if annotations["cnpg.io/hibernation"] == "on" then
        hs.status = "Progressing"
        hs.message = "Hibernating"
        return hs
      end
      hs.status = phases[obj.status.phase] or "Unknown"
      hs.message = obj.status.phaseReason
      return hs

  # Keycloak groups (token claim `groups`) -> Argo CD roles. No group = logged in, sees nothing.
  # Object = <project>/<app>. A deny line beats any allow, including role:admin.
  rbac:
    scopes: "[groups]"
    policy.default: ""
    policy.csv: |
      # devops: admin, except hands-on changes to prod apps. Prod only changes through a PR
      # to values-prod.yaml, which auto-sync applies (the controller is not bound by RBAC).
      # update/* and delete/* cover resources inside the app (Argo CD 3 no longer inherits them).
      g, devops, role:admin
      p, devops, applications, sync, shop-prod/*, deny
      p, devops, applications, update, shop-prod/*, deny
      p, devops, applications, update/*, shop-prod/*, deny
      p, devops, applications, delete, shop-prod/*, deny
      p, devops, applications, delete/*, shop-prod/*, deny
      p, devops, applications, override, shop-prod/*, deny
      p, devops, applications, action/*, shop-prod/*, deny
      p, devops, exec, create, shop-prod/*, deny

      # viewers: read-only, dev apps only (no prod, no platform).
      p, role:dev-viewer, applications, get, shop-dev/*, allow
      p, role:dev-viewer, logs, get, shop-dev/*, allow
      p, role:dev-viewer, projects, get, shop-dev, allow
      g, viewers, role:dev-viewer

server:
  ingress:
    enabled: true
    ingressClassName: kong

# Not needed: SSO goes straight to Keycloak (Phase 5), notifications are out of scope.
dex:
  enabled: false
notifications:
  enabled: false

# Small footprint for a laptop.
controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
