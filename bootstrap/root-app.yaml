# App of apps. The ONLY manifest ever applied by hand (bootstrap/up.sh does it once).
# Everything else on the cluster is reachable from here: root -> platform/*.yaml -> ...
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shoplite-lab/shoplite-gitops.git
    targetRevision: main
    path: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
