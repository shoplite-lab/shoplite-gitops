{{- if .Values.ingress.enabled }}
{{- range .Values.ingress.routes }}
# North-south traffic: Kong routes <host><paths> to this Service. One Ingress per route,
# because Kong options (plugins, methods) are per Ingress. Kong merges every Ingress
# from every namespace into one gateway config.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}-{{ required "ingress.routes[].name is required" .name }}
  labels:
    {{- include "microservice.labels" $ | nindent 4 }}
  {{- $annotations := deepCopy $.Values.ingress.annotations }}
  {{- with .plugins }}{{ $_ := set $annotations "konghq.com/plugins" (join "," .) }}{{ end }}
  {{- with .methods }}{{ $_ := set $annotations "konghq.com/methods" (join "," .) }}{{ end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  rules:
    - host: {{ required "ingress.host is required" $.Values.ingress.host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}
                port: { name: http }
          {{- end }}
{{- end }}
{{- end }}
