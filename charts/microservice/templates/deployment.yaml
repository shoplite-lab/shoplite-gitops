apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  {{- if .Values.paused }}
  replicas: 0
  {{- else if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3 # rollback is `git revert`, old ReplicaSets are not needed
  selector:
    matchLabels:
      {{- include "microservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "microservice.selectorLabels" . | nindent 8 }}
        {{- if .Values.observability.enabled }}
        # Routes the pod through the OTel Operator webhook (failurePolicy Fail, see
        # platform/opentelemetry-operator.yaml): no agent, no pod.
        shoplite/otel-agent: "true"
        {{- end }}
      {{- if .Values.observability.enabled }}
      annotations:
        # The OTel Operator adds the Java agent to the pod when it is created.
        instrumentation.opentelemetry.io/inject-java: {{ .Values.observability.instrumentation | quote }}
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        # Explicit UID for every container of the pod, including injected ones: the OTel
        # agent's init container image defaults to root and would be refused otherwise.
        runAsUser: {{ .Values.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas over nodes when possible (soft rule: still schedules on 1 node).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "microservice.selectorLabels" . | nindent 14 }}
      containers:
        - name: app
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            {{- if .Values.postgres.enabled }}
            # Build the URL from host + dbname instead of the Secret's ready-made `jdbc-uri`:
            # that one embeds ?password=..., and Hibernate logs the JDBC URL at start-up.
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-db-app, key: host }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-db-app, key: dbname }
            {{- if .Values.postgres.external.enabled }}
            - name: DB_PORT
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-db-app, key: port }
            - name: DB_URL
              value: jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode={{ .Values.postgres.external.sslMode }}
            {{- else }}
            - name: DB_URL
              value: jdbc:postgresql://$(DB_HOST):5432/$(DB_NAME)
            {{- end }}
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-db-app, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-db-app, key: password }
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - name: OIDC_ISSUER_URI # validated against the token's iss claim
              value: {{ .Values.oidc.issuerUri | quote }}
            # Setting jwk-set-uri makes Spring skip issuer discovery and fetch keys from here.
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI
              value: {{ .Values.oidc.jwkSetUri | quote }}
            {{- end }}
            {{- if .Values.observability.enabled }}
            # Spring Boot structured logging: one JSON object per line. The Java agent puts
            # trace_id/span_id in the MDC, so each line carries the trace it belongs to.
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: logstash
            {{- end }}
            {{- with .Values.jvmOptions }}
            # Read by the JVM before main(); the OTel Operator appends its -javaagent to it.
            - name: JAVA_TOOL_OPTIONS
              value: {{ . | quote }}
            {{- end }}
            {{- range $name, $ref := .Values.secretEnv }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef: { name: {{ $ref.secret }}, key: {{ $ref.key }} }
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          startupProbe:
            httpGet: { path: {{ .Values.probes.liveness }}, port: http }
            periodSeconds: 5
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startupFailureThreshold }}
          livenessProbe:
            httpGet: { path: {{ .Values.probes.liveness }}, port: http }
            periodSeconds: 10
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.livenessFailureThreshold }}
          readinessProbe:
            httpGet: { path: {{ .Values.probes.readiness }}, port: http }
            periodSeconds: 5
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: 3
          lifecycle:
            # Give Kong time to drop this pod from its upstream before the app stops
            # accepting connections (Spring then drains in-flight requests: graceful shutdown).
            preStop:
              sleep: { seconds: 5 }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp # the only writable path (JVM temp files, nginx cache, env.js)
      volumes:
        - name: tmp
          emptyDir: {}
