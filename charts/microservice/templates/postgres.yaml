{{- if and .Values.postgres.enabled (not .Values.postgres.external.enabled) }}
# CloudNativePG creates: StatefulSet-like pods, Services <release>-db-rw / -ro / -r,
# and the Secret <release>-db-app (username, password, jdbc-uri, ...) used by the Deployment.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-db
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
  annotations:
    # Database before the app; the app would only crash-loop until the DB is up.
    # Paused: the reverse. Postgres shuts down only once its clients disconnect (up to
    # 30 min), so the app must be scaled to 0 first or both wait for each other.
    argocd.argoproj.io/sync-wave: {{ if .Values.paused }}"1"{{ else }}"-1"{{ end }}
    # paused: CNPG stops the Postgres pods but keeps the PVC, so data survives.
    cnpg.io/hibernation: {{ if .Values.paused }}"on"{{ else }}"off"{{ end }}
spec:
  instances: {{ .Values.postgres.instances }}
  storage:
    size: {{ .Values.postgres.storage }}
  bootstrap:
    initdb:
      database: {{ required "postgres.database is required" .Values.postgres.database }}
      owner: {{ required "postgres.owner is required" .Values.postgres.owner }}
  postgresql:
    parameters:
      shared_buffers: 64MB
      max_connections: "50"
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
{{- end }}
