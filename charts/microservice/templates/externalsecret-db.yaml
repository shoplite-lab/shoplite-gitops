{{- if and .Values.postgres.enabled .Values.postgres.external.enabled }}
# External Postgres: the credentials Secret that CloudNativePG would have generated
# (<release>-db-app) is built here from a secret in the cloud's secret manager instead.
# The remote secret is JSON: {"host", "port", "dbname", "username", "password"}.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-db-app
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # the Secret must exist before the Deployment
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.postgres.external.secretStore }}
  target:
    name: {{ .Release.Name }}-db-app
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "postgres.external.remoteKey is required" .Values.postgres.external.remoteKey }}
{{- end }}
