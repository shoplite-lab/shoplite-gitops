# Defaults for a Spring Boot service. apps/<svc>/values*.yaml override what differs.

image:
  repository: ""
  tag: "" # git SHA, written by CI
  pullPolicy: IfNotPresent

replicaCount: 1
containerPort: 8080
runAsUser: 10001 # USER in the services' Dockerfiles

# Spring Boot Actuator probe groups (management.endpoint.health.probes.enabled=true).
probes:
  liveness: /actuator/health/liveness
  readiness: /actuator/health/readiness
  # startupProbe allows up to 5s x 120 = 10 min for the JVM to boot before liveness kicks in.
  # Only a ceiling: a pod is Ready as soon as it answers. On a laptop a dozen JVMs (plus the
  # OTel agent) starting together share 8 cores; 3 min was not enough and every probe kill
  # restarted the boot from scratch.
  startupFailureThreshold: 120
  # Kubernetes defaults (1s timeout, 3 misses) kill a healthy but CPU-starved JVM: a slow
  # /actuator/health is not a dead app. A liveness kill restarts the boot, which costs more
  # CPU and slows everyone else down -> restart storm across the cluster.
  timeoutSeconds: 5
  livenessFailureThreshold: 6 # 1 min unanswered before a restart

# JAVA_TOOL_OPTIONS, tuned for ~15 JVMs sharing a laptop's 8 CPUs (no CPU limits, so each
# JVM would otherwise size itself for all 8):
#   ActiveProcessorCount=2  fewer GC / JIT / ForkJoin threads per JVM
#   TieredStopAtLevel=1     C1 JIT only: far less CPU while starting, lower peak speed
#   UseSerialGC             no parallel GC threads; fine for heaps of a few hundred MB
# On real nodes with CPU requests sized properly, drop the last two.
jvmOptions: -XX:ActiveProcessorCount=2 -XX:TieredStopAtLevel=1 -XX:+UseSerialGC

# Set per environment by apps/appset.yaml. true = Deployment scaled to 0 and Postgres
# hibernated (pods stopped, PVC and data kept). Undo by flipping it back to false.
paused: false

# Plain environment variables: NAME: value
env: {}
# From Secrets: NAME: { secret: <name>, key: <key> }
secretEnv: {}

resources:
  requests: { cpu: 50m, memory: 384Mi }
  limits: { memory: 768Mi } # no CPU limit: throttling hurts JVM startup more than it protects

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  # Scale up only on load that lasts: a JVM burns CPU for a minute or two after it turns
  # Ready (JIT warm-up), which the HPA would otherwise read as traffic.
  scaleUpStabilizationSeconds: 120

# Only meaningful with 2+ replicas: keeps one pod up during node drains.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

ingress:
  enabled: false
  className: kong
  host: ""
  annotations: {} # added to every route
  # One entry = one Kong route (Ingress <release>-<name>):
  #   paths:   URL prefixes, e.g. [/api/users]
  #   plugins: KongClusterPlugins from platform-resources/kong, e.g. [jwt-keycloak]
  #   methods: limit the route to these HTTP methods (default: all)
  routes: []

# Spring Security resource server. Tokens carry iss = the PUBLIC Keycloak URL (what the
# browser uses), but the signing keys are fetched straight from the Keycloak Service:
# pods never resolve auth.localhost, and token checks do not depend on Kong being up.
oidc:
  enabled: false
  issuerUri: http://auth.localhost/realms/shoplite
  jwkSetUri: http://keycloak-service.keycloak:8080/realms/shoplite/protocol/openid-connect/certs

# Traces + metrics: the OpenTelemetry Java agent, injected by the OTel Operator from the
# Instrumentation resource below (platform-resources/observability), no code change.
# Logs: JSON on stdout, shipped to Loki by Alloy.
observability:
  enabled: false
  instrumentation: observability/java # <namespace>/<Instrumentation name>

# Database-per-service: a dedicated CloudNativePG cluster owned by this release.
# The operator generates the credentials Secret <release>-db-app; the Deployment reads
# DB_URL / DB_USER / DB_PASSWORD from it, so no password is ever written by a human.
postgres:
  enabled: false
  instances: 1
  database: ""
  owner: ""
  storage: 1Gi
  # external: a managed Postgres outside the cluster (Neon, Cloud SQL...) instead of the
  # CNPG Cluster above. Nothing is created for the database itself; instead an ExternalSecret
  # builds the very same Secret <release>-db-app (host, port, dbname, username, password)
  # from a Secret Manager secret holding that JSON, so the Deployment does not change.
  # Needs the External Secrets Operator (GKE only; k3d keeps CNPG).
  external:
    enabled: false
    sslMode: require
    secretStore: gcp-secret-manager # name of the ClusterSecretStore
    remoteKey: "" # Secret Manager secret name, e.g. shoplite-db-product-service-dev
