apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - database.yaml
  - keycloak.yaml
  - realm-import-job.yaml
# realm.yaml stays a plain, readable file; kustomize wraps it in a ConfigMap.
configMapGenerator:
  - name: realm-shoplite
    files: [realm.yaml]
generatorOptions:
  disableNameSuffixHash: true # the Job runs on every sync anyway (PostSync hook)
