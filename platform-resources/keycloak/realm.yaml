# Realm `shoplite` as code - applied by keycloak-config-cli (realm-import-job.yaml).
# Edit here, push, and Argo CD re-runs the import. Changes made in the admin console
# are overwritten on the next run, like any other GitOps drift.
#
# Values written as $ + (env:SOME_NAME) come from Secret keycloak/realm-secrets, never from
# git. (Not spelled out here: keycloak-config-cli substitutes inside comments too.)
#
# One realm serves both shop-dev and shop-prod (one issuer, one Kong credential) to keep
# the demo small; a real setup would give prod its own realm or its own Keycloak.
realm: shoplite
enabled: true
displayName: ShopLite
sslRequired: external # HTTPS required except from private IPs (local cluster is all private)
registrationAllowed: true
loginWithEmailAllowed: true
rememberMe: true
accessTokenLifespan: 300 # 5 min; the frontend refreshes silently
ssoSessionIdleTimeout: 1800

roles:
  realm:
    - name: customer
      description: Normal shopper
    - name: admin
      description: Can manage products
    - name: stock-writer
      description: "Service role: reserve stock (order-service service account)"
    # Roles every user gets, self-registered ones included. keycloak-config-cli updates
    # the default role only when it is declared here (the realm's defaultRole field is ignored).
    - name: default-roles-shoplite
      composite: true
      composites:
        realm: [offline_access, uma_authorization, customer]
        client:
          account: [view-profile, manage-account]

groups:
  - name: devops # -> Argo CD admin + Grafana Admin (Phase 5)
  - name: viewers # -> read-only

clientScopes:
  # Adds a `groups` claim (group names) to tokens of every client that requests it.
  - name: groups
    protocol: openid-connect
    attributes:
      include.in.token.scope: "true"
    protocolMappers:
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        config:
          claim.name: groups
          full.path: "false"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

clients:
  # Browser app: public client (no secret can be kept in a browser) + PKCE.
  - clientId: shop-frontend
    name: ShopLite Web
    publicClient: true
    standardFlowEnabled: true
    # Password grant only so the README can show curl examples; disable for a real app.
    directAccessGrantsEnabled: true
    redirectUris:
      - $(env:SHOP_PROD_URL)/*
      - $(env:SHOP_DEV_URL)/*
      - http://localhost:5173/*
    webOrigins: ["+"] # = origins of the redirect URIs
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "+"
    defaultClientScopes: [web-origins, acr, profile, roles, basic, email, groups]

  # Machine client: order-service gets its own token (client credentials) to call
  # product-service's internal stock endpoint.
  - clientId: order-service
    name: Order Service (machine)
    publicClient: false
    secret: $(env:ORDER_SERVICE_CLIENT_SECRET)
    standardFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true

  # Ops tools: confidential clients (the secret lives in the tool's pod). Both read the
  # `groups` claim: devops -> admin, viewers -> read-only, anyone else gets no access.
  # Same realm session as the shop: logged in once, Grafana and Argo CD open without a password.
  - clientId: grafana
    name: Grafana
    publicClient: false
    secret: $(env:GRAFANA_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    redirectUris: [$(env:GRAFANA_URL)/login/generic_oauth]
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: $(env:GRAFANA_URL)/login
    defaultClientScopes: [web-origins, acr, profile, roles, basic, email, groups]

  - clientId: argocd
    name: Argo CD
    publicClient: false
    secret: $(env:ARGOCD_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    redirectUris:
      - $(env:ARGOCD_URL)/auth/callback
      - http://localhost:8085/auth/callback # `argocd login --sso` from a terminal
    attributes:
      post.logout.redirect.uris: $(env:ARGOCD_URL)##$(env:ARGOCD_URL)/*
    defaultClientScopes: [web-origins, acr, profile, roles, basic, email, groups]

  # Kafbat UI (Spring Security OAuth2 client, redirect path /login/oauth2/code/<registration>).
  - clientId: kafka-ui
    name: Kafbat UI
    publicClient: false
    secret: $(env:KAFKA_UI_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    redirectUris: [$(env:KAFKA_UI_URL)/login/oauth2/code/keycloak]
    attributes:
      post.logout.redirect.uris: $(env:KAFKA_UI_URL)/*
    defaultClientScopes: [web-origins, acr, profile, roles, basic, email, groups]

users:
  - username: alice
    enabled: true
    email: alice@shoplite.local
    emailVerified: true
    firstName: Alice
    lastName: Customer
    credentials:
      - { type: password, value: $(env:ALICE_PASSWORD), temporary: false }
    realmRoles: [default-roles-shoplite]
  - username: bob
    enabled: true
    email: bob@shoplite.local
    emailVerified: true
    firstName: Bob
    lastName: Admin
    credentials:
      - { type: password, value: $(env:BOB_PASSWORD), temporary: false }
    realmRoles: [default-roles-shoplite, admin]
  - username: devops1
    enabled: true
    email: devops1@shoplite.local
    emailVerified: true
    firstName: Dev
    lastName: Ops
    credentials:
      - { type: password, value: $(env:DEVOPS1_PASSWORD), temporary: false }
    realmRoles: [default-roles-shoplite]
    groups: [devops]
  - username: viewer1
    enabled: true
    email: viewer1@shoplite.local
    emailVerified: true
    firstName: View
    lastName: Only
    credentials:
      - { type: password, value: $(env:VIEWER1_PASSWORD), temporary: false }
    realmRoles: [default-roles-shoplite]
    groups: [viewers]
  - username: service-account-order-service
    enabled: true
    serviceAccountClientId: order-service
    realmRoles: [default-roles-shoplite, stock-writer]

components:
  org.keycloak.keys.KeyProvider:
    # Signing key from realm-secrets. Its public half is Kong's jwt credential
    # (kong/keycloak-jwt), so both are generated together by bootstrap/secrets.sh.
    - name: rsa-shoplite
      providerId: rsa
      subComponents: {}
      config:
        priority: ["200"]
        enabled: ["true"]
        active: ["true"]
        algorithm: [RS256]
        privateKey: [$(env:REALM_RSA_PRIVATE_KEY)]
    - name: hmac-generated
      providerId: hmac-generated
      subComponents: {}
      config:
        priority: ["100"]
        algorithm: [HS512]
    - name: aes-generated
      providerId: aes-generated
      subComponents: {}
      config:
        priority: ["100"]
